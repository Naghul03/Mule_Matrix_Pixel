version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mule_matrix_db
    environment:
      POSTGRES_USER: mule_user
      POSTGRES_PASSWORD: mule_pass
      POSTGRES_DB: mule_matrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mule_user -d mule_matrix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
